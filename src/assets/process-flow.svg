<svg viewBox="0 0 1000 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="380" fill="#FFFFFF"/>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4C8BF5" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34A853" />
    </marker>
    <marker id="arr-yellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBC04" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF6B00" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C00000" />
    </marker>
  </defs>

  <!-- Arc 1: Blue (Empathize) -->
  <path d="M 80 230 A 100 100 0 1 1 230 205" stroke="#4C8BF5" stroke-width="26" stroke-linecap="round" marker-end="url(#arr-blue)" />
  
  <!-- Arc 2: Green (Define) -->
  <path d="M 250 155 A 100 100 0 1 0 395 175" stroke="#34A853" stroke-width="26" stroke-linecap="round" marker-end="url(#arr-green)" />

  <!-- Arc 3: Yellow (Ideate) -->
  <path d="M 415 230 A 100 100 0 1 1 565 205" stroke="#FBBC04" stroke-width="26" stroke-linecap="round" marker-end="url(#arr-yellow)" />

  <!-- Arc 4: Orange (Prototype) -->
  <path d="M 585 155 A 100 100 0 1 0 730 175" stroke="#FF6B00" stroke-width="26" stroke-linecap="round" marker-end="url(#arr-orange)" />

  <!-- Arc 5: Red (Test) -->
  <path d="M 750 230 A 100 100 0 1 1 915 245" stroke="#C00000" stroke-width="26" stroke-linecap="round" marker-end="url(#arr-red)" />

  <!-- Stage 1: Empathize -->
  <text x="160" y="145" text-anchor="middle" fill="#000000" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Empathize</text>
  <path d="M 160 162 C 153 155 142 165 160 180 C 178 165 167 155 160 162 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stage 2: Define -->
  <circle cx="316" cy="200" r="10" fill="none" stroke="#000000" stroke-width="2" />
  <line x1="323" y1="207" x2="333" y2="217" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <text x="325" y="250" text-anchor="middle" fill="#000000" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Define</text>

  <!-- Stage 3: Ideate -->
  <text x="495" y="145" text-anchor="middle" fill="#000000" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Ideate</text>
  <path d="M 495 162 C 488 162 485 170 488 177 C 491 182 493 184 493 187 L 497 187 C 497 184 499 182 502 177 C 505 170 502 162 495 162 Z M 493 190 L 497 190 M 494 193 L 496 193" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />

  <!-- Stage 4: Prototype -->
  <path d="M 655 200 L 670 190 L 664 202 L 670 214 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round" transform="rotate(-30 660 200)" />
  <text x="660" y="250" text-anchor="middle" fill="#000000" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Prototype</text>

  <!-- Stage 5: Test -->
  <text x="830" y="145" text-anchor="middle" fill="#000000" font-size="22" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Test</text>
  <circle cx="830" cy="175" r="11" fill="none" stroke="#000000" stroke-width="2" />
  <path d="M 824 175 L 828 179 L 836 170" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
